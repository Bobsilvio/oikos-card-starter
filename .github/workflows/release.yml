name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build all cards
        run: |
          for d in cards/*/; do
            case "$d" in cards/_*) continue;; esac
            [ -f "${d}manifest.json" ] || continue
            [ -d "${d}src" ]           || continue
            node tools/build-card.mjs "$d"
          done

      - name: Generate root manifest
        run: node tools/generate-manifest.mjs

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            manifest.json
            cards/*/manifest.json
            cards/*/dist/**
            cards/*/preview*.png
          generate_release_notes: true
